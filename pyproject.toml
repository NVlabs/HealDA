[project]
name = "healda"
version = "0.1.0"
description = "Training workflows and reusable components for HealDA data assimilation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Aayush Gupta", email = "aaygupta@nvidia.com" },
    { name = "Noah Brenowitz", email = "nbrenowitz@nvidia.com" },
    { name = "Alberto Carpentieri", email = "acarpentieri@nvidia.com" },
    { name = "Negin Sobhani", email = "nsobhani@nvidia.com" },
]
keywords = ["data-assimilation", "deep-learning", "weather"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "cartopy>=0.25.0",
    "cftime>=1.6.5",
    "diffusers>=0.36.0",
    "einops",
    "fsspec",
    "h5py>=3.15.1",
    "earth2grid>=2025.11.1",
    "matplotlib>=3.10.8",
    "numba>=0.64",
    "numpy>=1.26.0",
    "nvidia-physicsnemo>=2.2.0a0",
    "obstore>=0.10.1",
    "pandas>=2.3.3",
    "psutil>=7.1.3",
    "pyarrow>=21.0.0",
    "python-dotenv>=1.2.1",
    "scipy>=1.14",
    "s3fs>=2025.10.0",
    "triton>=3.6.0; sys_platform == 'linux' and python_version < '3.15'",
    "tensorboard>=2.20.0",
    "torch>=2.9.0",
    "torchmetrics>=1.8.2",
    "xarray>=2025.12.0",
    "zarr>=3.1.5",
    "wandb",
]

[project.urls]
Repository = "https://github.com/NVlabs/HealDA"
Issues = "https://github.com/NVlabs/HealDA/issues"

[project.optional-dependencies]
# Accelerates pixel attention on Blackwell; below compute capability 10.0 the
# kernels fall back to Triton, so the package is not required to run.
cutedsl = [
    "nvidia-cutlass-dsl[cu13]>=4.7.0",
]
# Only reached by attention_backend="te". 2.15.0 needs a newer cuBLAS than resolves
# here; 2.14.0 is what the container runs.
transformer-engine = [
    "transformer-engine[pytorch]==2.14.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv.sources]
earth2grid = { git = "https://github.com/NVlabs/earth2grid.git", rev = "11dcf1b0787a7eb6a8497a3a5a5e1fdcc31232d3" }
earth2studio = { git = "https://github.com/NVIDIA/earth2studio.git" }


[dependency-groups]
# Imported only by private/. `uv sync --group private`.
private = [
    "earth2studio[aifs2ens,aurora,fengwu]>=0.18.0a0",
    "duckdb",
    "icechunk>=1.1.14",
    "joblib>=1.5.3",
    "nnja-ai>=1.0.0",
    # earth2studio.data.utils imports it; the alpha does not declare it.
    "obspec>=0.1.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.2.0",
    "pytest-regtest>=2.1.0",
    "pre-commit>=3.0.0",
]

[tool.ruff]
line-length = 88
# Generated kernel sources; excluded from both lint and format.
exclude = [
    "third_party",
    "src/healda/models/kernels/triton_pixel_attention.py",
    "src/healda/models/obs_embedding/fused_film_triton.py",
    "src/healda/models/kernels/cutedsl_temporal_attention.py",
    "src/healda/models/kernels/cutedsl_pixel_attention.py",
]

[project.scripts]
healda-train = "healda.cli.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/healda"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/healda",
    "/LICENSE",
    "/README.md",
]
