site_name: HealDA
site_description: Observation-conditioned atmospheric data assimilation on the HEALPix grid
site_url: !ENV [SITE_URL, "https://nvlabs.github.io/HealDA/"]
repo_url: https://github.com/NVlabs/HealDA
repo_name: NVlabs/HealDA
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.action.edit
  font:
    code: Roboto Mono
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: light
      primary: custom
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: dark
      primary: custom
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/css/color-schemes.css
  - assets/css/fonts.css
  - assets/css/custom-material.css

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: list
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true

hooks:
  - docs/hooks.py

exclude_docs: |
  hooks.py
  __pycache__/
  examples/*.py

validation:
  links:
    unrecognized_links: warn

# The home page is built from the README, which lives outside docs/.
watch:
  - README.md

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra:
  # Versions are published by mike into the gh-pages branch; "main" tracks the
  # default branch.
  version:
    provider: mike
    default: main
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NVlabs/HealDA

copyright: |
  &copy; Copyright 2026 NVIDIA CORPORATION &amp; AFFILIATES. All rights reserved.

nav:
  - Home: index.md
  - Observations: observations.md
  - Examples: examples.md
  - API reference: api.md
